<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Keyless enterprise APIM gateway overview</title>
  <desc id="desc">Local Microsoft Agent Framework and Foundry Agent Service call four APIM APIs for models, raw MCP, Toolbox, and A2A. APIM uses managed identity for Azure backends.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#605e5c"/></marker>
    <style>
      .title{font:600 19px 'Segoe UI',sans-serif;fill:#201f1e}.label{font:600 13px 'Segoe UI',sans-serif;fill:#201f1e}.text{font:12px 'Segoe UI',sans-serif;fill:#323130}.small{font:11px 'Segoe UI',sans-serif;fill:#605e5c}.lane{font:600 12px 'Segoe UI',sans-serif;fill:#605e5c;letter-spacing:.4px}.box{rx:6;stroke-width:1.5}.consumer{fill:#e8f1fb;stroke:#0078d4}.gateway{fill:#dff6dd;stroke:#107c10}.asset{fill:#fff4ce;stroke:#c19c00}.line{fill:none;stroke:#605e5c;stroke-width:1.6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="430" fill="#ffffff"/>
  <text x="24" y="31" class="title">One customer-owned gateway, two consumers, four governed surfaces</text>
  <text x="42" y="67" class="lane">CONSUMERS</text><text x="449" y="67" class="lane">AZURE API MANAGEMENT</text><text x="828" y="67" class="lane">ENTERPRISE ASSETS</text>

  <rect x="40" y="90" width="230" height="78" class="box consumer"/>
  <text x="155" y="119" text-anchor="middle" class="label">Local MAF application</text>
  <text x="155" y="142" text-anchor="middle" class="text">DefaultAzureCredential</text>
  <text x="155" y="158" text-anchor="middle" class="small">signed-in user or workload identity</text>
  <rect x="40" y="208" width="230" height="92" class="box consumer"/>
  <text x="155" y="238" text-anchor="middle" class="label">Foundry Agent Service</text>
  <text x="155" y="261" text-anchor="middle" class="text">project managed identity</text>
  <text x="155" y="279" text-anchor="middle" class="small">project-scoped connections</text>

  <rect x="390" y="84" width="310" height="232" class="box gateway"/>
  <text x="545" y="112" text-anchor="middle" class="label">APIM Standard v2</text>
  <text x="545" y="135" text-anchor="middle" class="small">validate tenant + audience + caller oid</text>
  <rect x="420" y="154" width="250" height="31" rx="4" fill="#fff" stroke="#107c10"/><text x="545" y="175" text-anchor="middle" class="text">/inference-mi/openai</text>
  <rect x="420" y="192" width="250" height="31" rx="4" fill="#fff" stroke="#107c10"/><text x="545" y="213" text-anchor="middle" class="text">/learn-mcp-mi/mcp</text>
  <rect x="420" y="230" width="250" height="31" rx="4" fill="#fff" stroke="#107c10"/><text x="545" y="251" text-anchor="middle" class="text">/toolboxes/research/mcp</text>
  <rect x="420" y="268" width="250" height="31" rx="4" fill="#fff" stroke="#107c10"/><text x="545" y="289" text-anchor="middle" class="text">/enterprise-agents/.../</text>

  <rect x="820" y="82" width="260" height="64" class="box asset"/>
  <text x="950" y="108" text-anchor="middle" class="label">Foundry model pool</text><text x="950" y="128" text-anchor="middle" class="small">East US 2 + Sweden Central</text>
  <rect x="820" y="166" width="260" height="58" class="box asset"/>
  <text x="950" y="191" text-anchor="middle" class="label">Microsoft Learn MCP</text><text x="950" y="210" text-anchor="middle" class="small">public remote server</text>
  <rect x="820" y="244" width="260" height="64" class="box asset"/>
  <text x="950" y="270" text-anchor="middle" class="label">Foundry Toolbox</text><text x="950" y="290" text-anchor="middle" class="small">MCP capability with APIM egress</text>
  <rect x="820" y="328" width="260" height="64" class="box asset"/>
  <text x="950" y="354" text-anchor="middle" class="label">Foundry enterprise agent</text><text x="950" y="374" text-anchor="middle" class="small">incoming A2A enabled</text>

  <path d="M270 129 H390" class="line"/><path d="M270 254 H390" class="line"/>
  <text x="330" y="113" text-anchor="middle" class="small">Entra token</text><text x="330" y="238" text-anchor="middle" class="small">project MI token</text>
  <path d="M700 169 C755 169 765 114 820 114" class="line"/><path d="M700 207 H820" class="line"/><path d="M700 246 C758 246 762 276 820 276" class="line"/><path d="M700 284 C756 284 765 360 820 360" class="line"/>
  <text x="755" y="103" text-anchor="middle" class="small">APIM MI</text><text x="759" y="194" text-anchor="middle" class="small">remove auth</text><text x="758" y="264" text-anchor="middle" class="small">APIM MI</text><text x="756" y="346" text-anchor="middle" class="small">APIM MI</text>

  <rect x="40" y="344" width="660" height="48" rx="6" fill="#f3f2f1" stroke="#8a8886"/>
  <text x="370" y="365" text-anchor="middle" class="label">Credential termination at APIM</text>
  <text x="370" y="383" text-anchor="middle" class="small">Caller tokens are validated, then replaced or removed. No API key or APIM subscription key is used by the lab.</text>
</svg>
