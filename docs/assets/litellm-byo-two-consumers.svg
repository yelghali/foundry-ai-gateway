<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">LiteLLM bring-your-own ModelGateway with two consumers</title>
  <desc id="desc">Local Microsoft Agent Framework and Foundry Agent Service use bearer credentials to access model, MCP, and A2A surfaces through LiteLLM. An authenticated shim provides host-root A2A discovery. LiteLLM uses managed identity for private Foundry models.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#605e5c"/></marker>
    <style>
      .title{font:600 19px 'Segoe UI',sans-serif;fill:#201f1e}.label{font:600 13px 'Segoe UI',sans-serif;fill:#201f1e}.text{font:12px 'Segoe UI',sans-serif;fill:#323130}.small{font:11px 'Segoe UI',sans-serif;fill:#605e5c}.lane{font:600 12px 'Segoe UI',sans-serif;fill:#605e5c;letter-spacing:.4px}.box{rx:6;stroke-width:1.5}.consumer{fill:#e8f1fb;stroke:#0078d4}.connection{fill:#fff4ce;stroke:#c19c00}.gateway{fill:#dff6dd;stroke:#107c10}.asset{fill:#f3f2f1;stroke:#605e5c}.shim{fill:#fde7e9;stroke:#d13438}.line{fill:none;stroke:#605e5c;stroke-width:1.6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="500" fill="#ffffff"/>
  <text x="24" y="31" class="title">Optional BYOM: one LiteLLM edge for model, MCP, and A2A</text>
  <text x="38" y="66" class="lane">CONSUMERS</text>
  <text x="300" y="66" class="lane">FOUNDRY CONNECTIONS</text>
  <text x="552" y="66" class="lane">LITELLM GATEWAY</text>
  <text x="908" y="66" class="lane">BACKENDS</text>

  <rect x="35" y="92" width="220" height="78" class="box consumer"/>
  <text x="145" y="121" text-anchor="middle" class="label">Local MAF application</text>
  <text x="145" y="144" text-anchor="middle" class="text">OpenAI, MCP, A2A clients</text>
  <text x="145" y="160" text-anchor="middle" class="small">bearer credential at runtime</text>
  <rect x="35" y="216" width="220" height="86" class="box consumer"/>
  <text x="145" y="246" text-anchor="middle" class="label">Foundry Agent Service</text>
  <text x="145" y="269" text-anchor="middle" class="text">hosted prompt agent</text>
  <text x="145" y="287" text-anchor="middle" class="small">credentials stay in connections</text>

  <rect x="300" y="102" width="205" height="184" class="box connection"/>
  <text x="402" y="130" text-anchor="middle" class="label">Connection contracts</text>
  <rect x="318" y="148" width="169" height="34" rx="4" fill="#fff" stroke="#c19c00"/><text x="402" y="170" text-anchor="middle" class="text">ModelGateway</text>
  <rect x="318" y="190" width="169" height="34" rx="4" fill="#fff" stroke="#c19c00"/><text x="402" y="212" text-anchor="middle" class="text">CustomKeys for MCP</text>
  <rect x="318" y="232" width="169" height="34" rx="4" fill="#fff" stroke="#c19c00"/><text x="402" y="254" text-anchor="middle" class="text">RemoteA2A</text>

  <rect x="548" y="86" width="300" height="278" class="box gateway"/>
  <text x="698" y="115" text-anchor="middle" class="label">LiteLLM on Azure Container Apps</text>
  <text x="698" y="136" text-anchor="middle" class="small">authenticated public test edge</text>
  <rect x="575" y="155" width="246" height="48" rx="4" fill="#fff" stroke="#107c10"/>
  <text x="698" y="177" text-anchor="middle" class="text">/v1/chat/completions</text><text x="698" y="194" text-anchor="middle" class="small">gpt-5.1 routing</text>
  <rect x="575" y="218" width="246" height="48" rx="4" fill="#fff" stroke="#107c10"/>
  <text x="698" y="240" text-anchor="middle" class="text">/mcp/</text><text x="698" y="257" text-anchor="middle" class="small">Microsoft Learn tool aggregation</text>
  <rect x="575" y="281" width="246" height="48" rx="4" fill="#fff" stroke="#107c10"/>
  <text x="698" y="303" text-anchor="middle" class="text">/a2a/{agent-id}</text><text x="698" y="320" text-anchor="middle" class="small">UUID-based Agent Gateway route</text>
  <text x="698" y="350" text-anchor="middle" class="small">UAMI for private Foundry model access</text>

  <rect x="300" y="332" width="205" height="72" class="box shim"/>
  <text x="402" y="358" text-anchor="middle" class="label">Protected A2A shim</text>
  <text x="402" y="379" text-anchor="middle" class="small">host-root card + bearer validation</text>
  <text x="402" y="395" text-anchor="middle" class="small">forward + response normalization</text>

  <rect x="900" y="92" width="190" height="72" class="box asset"/>
  <text x="995" y="120" text-anchor="middle" class="label">Private Foundry models</text><text x="995" y="142" text-anchor="middle" class="small">two backend accounts</text>
  <rect x="900" y="207" width="190" height="64" class="box asset"/>
  <text x="995" y="234" text-anchor="middle" class="label">Microsoft Learn MCP</text><text x="995" y="254" text-anchor="middle" class="small">remote MCP server</text>
  <rect x="900" y="316" width="190" height="64" class="box asset"/>
  <text x="995" y="343" text-anchor="middle" class="label">Dummy specialist</text><text x="995" y="363" text-anchor="middle" class="small">upstream A2A agent</text>

  <path d="M255 131 H548" class="line"/><text x="403" y="119" text-anchor="middle" class="small">bearer credential</text>
  <path d="M255 259 H300" class="line"/><path d="M505 194 H548" class="line"/><text x="526" y="182" text-anchor="middle" class="small">bearer</text>
  <path d="M255 282 C270 325 279 368 300 368" class="line"/><path d="M505 368 C535 368 538 305 575 305" class="line"/>
  <path d="M848 179 C875 179 877 128 900 128" class="line"/><text x="873" y="142" text-anchor="middle" class="small">UAMI</text>
  <path d="M848 242 H900" class="line"/><path d="M848 305 C873 305 877 348 900 348" class="line"/>

  <rect x="35" y="432" width="1055" height="42" rx="6" fill="#f3f2f1" stroke="#8a8886"/>
  <text x="562" y="450" text-anchor="middle" class="label">Authentication boundary</text>
  <text x="562" y="467" text-anchor="middle" class="small">Consumer to LiteLLM: stored bearer credential. LiteLLM to private Foundry models: managed identity with no model key.</text>
</svg>