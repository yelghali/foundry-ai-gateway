<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
  <title id="title">Scenario 3 Foundry Toolbox flow for two consumers</title><desc id="desc">Both consumers call a public Foundry Toolbox endpoint through the public APIM gateway. The Toolbox then calls the public raw MCP APIM surface with its project managed identity.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#605e5c"/></marker><style>.title{font:600 19px 'Segoe UI',sans-serif;fill:#201f1e}.label{font:600 14px 'Segoe UI',sans-serif;fill:#201f1e}.text{font:12px 'Segoe UI',sans-serif;fill:#323130}.small{font:11px 'Segoe UI',sans-serif;fill:#605e5c}.box{rx:6;stroke-width:1.5}.blue{fill:#e8f1fb;stroke:#0078d4}.green{fill:#dff6dd;stroke:#107c10}.gold{fill:#fff4ce;stroke:#c19c00}.gray{fill:#f3f2f1;stroke:#8a8886}.line{fill:none;stroke:#605e5c;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
  <rect width="1120" height="410" fill="#fff"/><text x="24" y="31" class="title">Scenario 3: govern public Toolbox ingress and MCP egress</text>
  <rect x="30" y="70" width="220" height="78" class="box blue"/><text x="140" y="99" text-anchor="middle" class="label">3a. Local MAF agent</text><text x="140" y="123" text-anchor="middle" class="text">Toolbox as MCP server</text>
  <rect x="30" y="190" width="220" height="88" class="box blue"/><text x="140" y="220" text-anchor="middle" class="label">3b. Foundry app agent</text><text x="140" y="244" text-anchor="middle" class="text">MCPTool + RemoteTool</text><text x="140" y="264" text-anchor="middle" class="small">project MI connection</text>
  <rect x="334" y="105" width="260" height="136" class="box green"/><text x="464" y="135" text-anchor="middle" class="label">APIM Toolbox API (public)</text><text x="464" y="158" text-anchor="middle" class="text">/toolboxes/research/mcp</text><text x="464" y="183" text-anchor="middle" class="small">validate caller oid</text><text x="464" y="203" text-anchor="middle" class="small">APIM MI -> Foundry</text><text x="464" y="223" text-anchor="middle" class="small">unbuffered MCP response</text>
  <rect x="690" y="104" width="260" height="138" class="box gold"/><text x="820" y="134" text-anchor="middle" class="label">Versioned Foundry Toolbox</text><text x="820" y="160" text-anchor="middle" class="text">public project endpoint</text><text x="820" y="184" text-anchor="middle" class="text">contains Microsoft Learn MCPTool</text><text x="820" y="209" text-anchor="middle" class="small">egress identity: publisher project MI</text>
  <rect x="465" y="297" width="260" height="82" class="box green"/><text x="595" y="326" text-anchor="middle" class="label">APIM raw MCP API (public)</text><text x="595" y="351" text-anchor="middle" class="text">/learn-mcp-mi/mcp</text><text x="595" y="369" text-anchor="middle" class="small">validate Toolbox project oid</text>
  <rect x="840" y="297" width="240" height="82" class="box gold"/><text x="960" y="328" text-anchor="middle" class="label">Microsoft Learn MCP</text><text x="960" y="354" text-anchor="middle" class="small">public upstream</text>
  <path d="M250 109 C290 109 294 146 334 146" class="line"/><path d="M250 234 C290 234 294 199 334 199" class="line"/><text x="292" y="99" text-anchor="middle" class="small">Entra</text>
  <path d="M594 174 H690" class="line"/><text x="642" y="162" text-anchor="middle" class="small">APIM MI</text>
  <path d="M820 242 C820 279 725 278 690 297" class="line"/><text x="776" y="278" text-anchor="middle" class="small">project MI</text>
  <path d="M725 338 H840" class="line"/><text x="782" y="326" text-anchor="middle" class="small">no auth</text>
  <rect x="30" y="318" width="360" height="61" class="box gray"/><text x="210" y="341" text-anchor="middle" class="small">Foundry consumer uses a native driver here.</text><text x="210" y="360" text-anchor="middle" class="small">Connected APIM model + Toolbox currently returns 500.</text>
</svg>
