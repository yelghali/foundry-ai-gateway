<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">Scenario 4 Foundry A2A flow for two consumers</title><desc id="desc">Local MAF and Foundry Agent Service authenticate to APIM for agent-card discovery and A2A JSON-RPC. APIM uses its managed identity to call the Foundry enterprise agent.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#605e5c"/></marker><style>.title{font:600 19px 'Segoe UI',sans-serif;fill:#201f1e}.label{font:600 14px 'Segoe UI',sans-serif;fill:#201f1e}.text{font:12px 'Segoe UI',sans-serif;fill:#323130}.small{font:11px 'Segoe UI',sans-serif;fill:#605e5c}.box{rx:6;stroke-width:1.5}.blue{fill:#e8f1fb;stroke:#0078d4}.green{fill:#dff6dd;stroke:#107c10}.gold{fill:#fff4ce;stroke:#c19c00}.gray{fill:#f3f2f1;stroke:#8a8886}.line{fill:none;stroke:#605e5c;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#8a8886;stroke-width:1.4;stroke-dasharray:6 5;marker-end:url(#arrow)}</style></defs>
  <rect width="1120" height="390" fill="#fff"/><text x="24" y="31" class="title">Scenario 4: publish a Foundry-hosted agent through an A2A-aware APIM facade</text>
  <rect x="34" y="73" width="245" height="91" class="box blue"/><text x="156" y="103" text-anchor="middle" class="label">4a. Local MAF agent</text><text x="156" y="127" text-anchor="middle" class="text">a2a-sdk card resolver</text><text x="156" y="147" text-anchor="middle" class="small">credential on discovery + runtime</text>
  <rect x="34" y="218" width="245" height="103" class="box blue"/><text x="156" y="248" text-anchor="middle" class="label">4b. Foundry app agent</text><text x="156" y="272" text-anchor="middle" class="text">A2APreviewTool</text><text x="156" y="292" text-anchor="middle" class="small">RemoteA2A project MI connection</text><text x="156" y="309" text-anchor="middle" class="small">send_credentials_for_agent_card</text>
  <rect x="405" y="91" width="330" height="210" class="box green"/><text x="570" y="121" text-anchor="middle" class="label">APIM /enterprise-agents/.../</text><text x="570" y="148" text-anchor="middle" class="text">validate tenant + audience + oid</text><text x="570" y="174" text-anchor="middle" class="text">GET agentCard/v1.0</text><text x="570" y="197" text-anchor="middle" class="text">GET well-known card aliases</text><text x="570" y="220" text-anchor="middle" class="text">POST A2A JSON-RPC</text><text x="570" y="248" text-anchor="middle" class="small">rewrite all card URLs back to APIM</text><text x="570" y="269" text-anchor="middle" class="small">buffer cards; stream runtime responses</text><text x="570" y="289" text-anchor="middle" class="small">APIM MI has Foundry Agent Consumer</text>
  <rect x="842" y="114" width="244" height="155" class="box gold"/><text x="964" y="146" text-anchor="middle" class="label">Enterprise Foundry agent</text><text x="964" y="171" text-anchor="middle" class="text">enterprise-specialist</text><text x="964" y="196" text-anchor="middle" class="text">incoming A2A enabled</text><text x="964" y="222" text-anchor="middle" class="small">v0.3 + v1.0 cards</text><text x="964" y="242" text-anchor="middle" class="small">A2A JSON-RPC endpoint</text>
  <path d="M279 118 C340 118 344 145 405 145" class="line"/><path d="M279 269 C340 269 344 241 405 241" class="line"/><text x="343" y="106" text-anchor="middle" class="small">user token</text><text x="343" y="282" text-anchor="middle" class="small">project MI token</text>
  <path d="M735 190 H842" class="line"/><text x="789" y="178" text-anchor="middle" class="small">APIM MI token</text>
  <path d="M964 269 C964 330 570 350 570 301" class="dash"/><text x="782" y="342" text-anchor="middle" class="small">card advertises APIM runtime URL, never the direct Foundry URL</text>
  <rect x="35" y="344" width="395" height="31" class="box gray"/><text x="232" y="365" text-anchor="middle" class="small">A trailing slash is required on the Foundry connection target for card discovery.</text>
</svg>
