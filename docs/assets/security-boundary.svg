<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
  <title id="title">APIM security boundary checks</title><desc id="desc">Anonymous and wrong-audience requests to all four APIM surfaces are rejected with HTTP 401, while approved callers pass tenant, audience, and object ID validation.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#605e5c"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d13438"/></marker><style>.title{font:600 19px 'Segoe UI',sans-serif;fill:#201f1e}.label{font:600 14px 'Segoe UI',sans-serif;fill:#201f1e}.text{font:12px 'Segoe UI',sans-serif;fill:#323130}.small{font:11px 'Segoe UI',sans-serif;fill:#605e5c}.box{rx:6;stroke-width:1.5}.blue{fill:#e8f1fb;stroke:#0078d4}.green{fill:#dff6dd;stroke:#107c10}.red{fill:#fde7e9;stroke:#d13438}.gold{fill:#fff4ce;stroke:#c19c00}.line{fill:none;stroke:#605e5c;stroke-width:1.7;marker-end:url(#arrow)}.deny{fill:none;stroke:#d13438;stroke-width:1.8;marker-end:url(#redarrow)}</style></defs>
  <rect width="1120" height="350" fill="#fff"/><text x="24" y="31" class="title">Security verification: authentication is not authorization</text>
  <rect x="35" y="72" width="230" height="72" class="box red"/><text x="150" y="101" text-anchor="middle" class="label">Anonymous request</text><text x="150" y="125" text-anchor="middle" class="small">no Authorization header</text>
  <rect x="35" y="190" width="230" height="84" class="box red"/><text x="150" y="219" text-anchor="middle" class="label">Wrong-audience token</text><text x="150" y="243" text-anchor="middle" class="small">valid ARM token</text><text x="150" y="260" text-anchor="middle" class="small">aud != gateway audience</text>
  <rect x="390" y="83" width="330" height="180" class="box green"/><text x="555" y="114" text-anchor="middle" class="label">APIM validate-azure-ad-token</text><text x="555" y="143" text-anchor="middle" class="text">1. issuer tenant must match</text><text x="555" y="170" text-anchor="middle" class="text">2. audience must match</text><text x="555" y="197" text-anchor="middle" class="text">3. oid must be allowlisted</text><text x="555" y="227" text-anchor="middle" class="small">applies to model, MCP, Toolbox, and A2A</text><text x="555" y="247" text-anchor="middle" class="small">subscriptionRequired = false</text>
  <rect x="850" y="70" width="235" height="90" class="box red"/><text x="967" y="101" text-anchor="middle" class="label">HTTP 401</text><text x="967" y="126" text-anchor="middle" class="text">request stops at APIM</text><text x="967" y="146" text-anchor="middle" class="small">backend is not contacted</text>
  <rect x="850" y="208" width="235" height="90" class="box gold"/><text x="967" y="239" text-anchor="middle" class="label">Approved caller</text><text x="967" y="264" text-anchor="middle" class="text">user or project MI</text><text x="967" y="284" text-anchor="middle" class="small">continues to selected backend</text>
  <path d="M265 108 C330 108 330 130 390 130" class="deny"/><path d="M265 232 C330 232 330 212 390 212" class="deny"/><path d="M720 130 H850" class="deny"/><text x="785" y="118" text-anchor="middle" class="small">failed check</text>
  <path d="M720 229 C780 229 790 253 850 253" class="line"/><text x="786" y="244" text-anchor="middle" class="small">all checks pass</text>
  <text x="555" y="321" text-anchor="middle" class="small">The automated probe sends 2 invalid requests to each of 4 surfaces: 8 expected 401 responses.</text>
</svg>
