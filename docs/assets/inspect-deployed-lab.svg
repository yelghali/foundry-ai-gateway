<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">Inspect and run the predeployed lab</title>
  <desc id="desc">Learners read the generated environment manifest, inspect APIM and Foundry in Azure, run both consumers, and correlate the resulting requests in Log Analytics.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#605e5c"/></marker>
    <style>.title{font:600 19px 'Segoe UI',sans-serif;fill:#201f1e}.step{font:600 14px 'Segoe UI',sans-serif;fill:#201f1e}.text{font:12px 'Segoe UI',sans-serif;fill:#323130}.small{font:11px 'Segoe UI',sans-serif;fill:#605e5c}.box{rx:6;stroke-width:1.5}.blue{fill:#e8f1fb;stroke:#0078d4}.green{fill:#dff6dd;stroke:#107c10}.gold{fill:#fff4ce;stroke:#c19c00}.gray{fill:#f3f2f1;stroke:#8a8886}.line{fill:none;stroke:#605e5c;stroke-width:1.7;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1120" height="330" fill="#fff"/>
  <text x="24" y="31" class="title">The workshop starts after deployment: inspect, run, and observe</text>
  <rect x="30" y="72" width="230" height="144" class="box gray"/>
  <text x="145" y="101" text-anchor="middle" class="step">1. Read the manifest</text>
  <text x="145" y="127" text-anchor="middle" class="text">scenario-outputs.json</text>
  <text x="50" y="154" class="small">resource names and IDs</text>
  <text x="50" y="174" class="small">four APIM contract URLs</text>
  <text x="50" y="194" class="small">no credentials or secrets</text>
  <rect x="300" y="72" width="230" height="144" class="box green"/>
  <text x="415" y="101" text-anchor="middle" class="step">2. Inspect Azure</text>
  <text x="415" y="127" text-anchor="middle" class="text">APIM + Foundry portal</text>
  <text x="320" y="154" class="small">APIs, backends, and policies</text>
  <text x="320" y="174" class="small">projects and connections</text>
  <text x="320" y="194" class="small">diagnostic setting</text>
  <rect x="570" y="72" width="230" height="144" class="box blue"/>
  <text x="685" y="101" text-anchor="middle" class="step">3. Run consumers</text>
  <text x="685" y="127" text-anchor="middle" class="text">local MAF + Foundry agent</text>
  <text x="590" y="154" class="small">model and raw MCP</text>
  <text x="590" y="174" class="small">Toolbox and A2A</text>
  <text x="590" y="194" class="small">combined workflow</text>
  <rect x="840" y="72" width="250" height="144" class="box gold"/>
  <text x="965" y="101" text-anchor="middle" class="step">4. Correlate traffic</text>
  <text x="965" y="127" text-anchor="middle" class="text">APIM Log Analytics</text>
  <text x="860" y="154" class="small">surface and operation</text>
  <text x="860" y="174" class="small">status and latency</text>
  <text x="860" y="194" class="small">correlation ID</text>
  <path d="M260 144 H300" class="line"/>
  <path d="M530 144 H570" class="line"/>
  <path d="M800 144 H840" class="line"/>
  <rect x="176" y="250" width="768" height="54" class="box gray"/>
  <text x="560" y="273" text-anchor="middle" class="step">Facilitator-owned setup</text>
  <text x="560" y="293" text-anchor="middle" class="text">Bicep creates Azure resources; repeatable Python setup creates Foundry data-plane definitions</text>
</svg>