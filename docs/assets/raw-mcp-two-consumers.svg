<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Scenario 2 raw MCP flow for two consumers</title><desc id="desc">Local MAF and Foundry Agent Service call the Microsoft Learn MCP server through an Entra-protected APIM streamable HTTP API.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#605e5c"/></marker><style>.title{font:600 19px 'Segoe UI',sans-serif;fill:#201f1e}.label{font:600 14px 'Segoe UI',sans-serif;fill:#201f1e}.text{font:12px 'Segoe UI',sans-serif;fill:#323130}.small{font:11px 'Segoe UI',sans-serif;fill:#605e5c}.box{rx:6;stroke-width:1.5}.blue{fill:#e8f1fb;stroke:#0078d4}.green{fill:#dff6dd;stroke:#107c10}.gold{fill:#fff4ce;stroke:#c19c00}.gray{fill:#f3f2f1;stroke:#8a8886}.line{fill:none;stroke:#605e5c;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
  <rect width="1120" height="360" fill="#fff"/><text x="24" y="31" class="title">Scenario 2: expose an existing MCP server through APIM</text>
  <rect x="38" y="76" width="245" height="86" class="box blue"/><text x="160" y="106" text-anchor="middle" class="label">2a. Local MAF agent</text><text x="160" y="130" text-anchor="middle" class="text">MCPStreamableHTTPTool</text><text x="160" y="150" text-anchor="middle" class="small">bearer token on each request</text>
  <rect x="38" y="211" width="245" height="96" class="box blue"/><text x="160" y="241" text-anchor="middle" class="label">2b. Foundry app agent</text><text x="160" y="265" text-anchor="middle" class="text">MCPTool + project connection</text><text x="160" y="285" text-anchor="middle" class="small">ProjectManagedIdentity</text>
  <rect x="408" y="102" width="310" height="174" class="box green"/><text x="563" y="132" text-anchor="middle" class="label">APIM /learn-mcp-mi/mcp</text><text x="563" y="158" text-anchor="middle" class="text">POST, GET, DELETE</text><text x="563" y="181" text-anchor="middle" class="text">validate tenant + audience + oid</text><text x="563" y="204" text-anchor="middle" class="text">preserve streamable HTTP</text><text x="563" y="227" text-anchor="middle" class="text">buffer-response=false</text><text x="563" y="252" text-anchor="middle" class="small">delete Authorization before forwarding</text>
  <rect x="844" y="126" width="240" height="120" class="box gold"/><text x="964" y="160" text-anchor="middle" class="label">Microsoft Learn MCP</text><text x="964" y="186" text-anchor="middle" class="text">learn.microsoft.com/api/mcp</text><text x="964" y="211" text-anchor="middle" class="small">public upstream; caller token</text><text x="964" y="228" text-anchor="middle" class="small">never leaves APIM</text>
  <path d="M283 119 C340 119 350 155 408 155" class="line"/><path d="M283 259 C340 259 350 220 408 220" class="line"/><text x="345" y="109" text-anchor="middle" class="small">user token</text><text x="346" y="272" text-anchor="middle" class="small">project MI token</text>
  <path d="M718 189 H844" class="line"/><text x="781" y="177" text-anchor="middle" class="small">no credential</text>
  <rect x="360" y="305" width="400" height="36" class="box gray"/><text x="560" y="328" text-anchor="middle" class="small">The model call still follows Scenario 1; this diagram isolates the tool leg.</text>
</svg>
