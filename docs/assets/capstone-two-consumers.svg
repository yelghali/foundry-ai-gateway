<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
  <title id="title">Scenario 5 capstone orchestration</title><desc id="desc">Both consumers orchestrate APIM-published model, Toolbox, and A2A surfaces to answer one enterprise question.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#605e5c"/></marker><style>.title{font:600 19px 'Segoe UI',sans-serif;fill:#201f1e}.label{font:600 14px 'Segoe UI',sans-serif;fill:#201f1e}.text{font:12px 'Segoe UI',sans-serif;fill:#323130}.small{font:11px 'Segoe UI',sans-serif;fill:#605e5c}.box{rx:6;stroke-width:1.5}.blue{fill:#e8f1fb;stroke:#0078d4}.green{fill:#dff6dd;stroke:#107c10}.gold{fill:#fff4ce;stroke:#c19c00}.gray{fill:#f3f2f1;stroke:#8a8886}.line{fill:none;stroke:#605e5c;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
  <rect width="1120" height="400" fill="#fff"/><text x="24" y="31" class="title">Scenario 5: compose model, research, and specialist advice without bypassing APIM</text>
  <rect x="36" y="75" width="255" height="92" class="box blue"/><text x="164" y="105" text-anchor="middle" class="label">5a. Local MAF orchestrator</text><text x="164" y="130" text-anchor="middle" class="text">one in-process agent</text><text x="164" y="150" text-anchor="middle" class="small">asserts Toolbox and A2A calls occurred</text>
  <rect x="36" y="222" width="255" height="92" class="box blue"/><text x="164" y="252" text-anchor="middle" class="label">5b. Foundry app agent</text><text x="164" y="277" text-anchor="middle" class="text">one version with two tools</text><text x="164" y="297" text-anchor="middle" class="small">project MI connections through APIM</text>
  <rect x="400" y="62" width="310" height="278" class="box green"/><text x="555" y="92" text-anchor="middle" class="label">Customer-owned APIM</text>
  <rect x="430" y="118" width="250" height="51" rx="4" fill="#fff" stroke="#107c10"/><text x="555" y="140" text-anchor="middle" class="text">1. Model API</text><text x="555" y="158" text-anchor="middle" class="small">reason and synthesize</text>
  <rect x="430" y="187" width="250" height="51" rx="4" fill="#fff" stroke="#107c10"/><text x="555" y="209" text-anchor="middle" class="text">2. Toolbox MCP API</text><text x="555" y="227" text-anchor="middle" class="small">research Microsoft Learn</text>
  <rect x="430" y="256" width="250" height="51" rx="4" fill="#fff" stroke="#107c10"/><text x="555" y="278" text-anchor="middle" class="text">3. Enterprise A2A API</text><text x="555" y="296" text-anchor="middle" class="small">consult specialist agent</text>
  <rect x="830" y="73" width="250" height="72" class="box gold"/><text x="955" y="102" text-anchor="middle" class="label">Foundry model pool</text><text x="955" y="126" text-anchor="middle" class="small">OpenAI-compatible backend</text>
  <rect x="830" y="177" width="250" height="72" class="box gold"/><text x="955" y="206" text-anchor="middle" class="label">Foundry Toolbox</text><text x="955" y="230" text-anchor="middle" class="small">research capability</text>
  <rect x="830" y="281" width="250" height="72" class="box gold"/><text x="955" y="310" text-anchor="middle" class="label">Foundry A2A specialist</text><text x="955" y="334" text-anchor="middle" class="small">governance advice</text>
  <path d="M291 121 C348 121 348 160 400 160" class="line"/><path d="M291 268 C348 268 348 240 400 240" class="line"/><text x="344" y="109" text-anchor="middle" class="small">Entra</text>
  <path d="M710 143 C765 143 776 109 830 109" class="line"/><path d="M710 212 H830" class="line"/><path d="M710 281 C768 281 776 317 830 317" class="line"/>
  <rect x="244" y="360" width="632" height="28" class="box gray"/><text x="560" y="379" text-anchor="middle" class="small">Question: What is Azure API Management, and why should an enterprise put agents behind it?</text>
</svg>
