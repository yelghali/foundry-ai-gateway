<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
  <title id="title">APIM observability flow</title>
  <desc id="desc">Local MAF and Foundry Agent Service call four APIM surfaces. A service diagnostic setting exports gateway request metadata and metrics to dedicated Log Analytics tables for portal and KQL inspection.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#605e5c"/></marker>
    <style>.title{font:600 19px 'Segoe UI',sans-serif;fill:#201f1e}.label{font:600 14px 'Segoe UI',sans-serif;fill:#201f1e}.text{font:12px 'Segoe UI',sans-serif;fill:#323130}.small{font:11px 'Segoe UI',sans-serif;fill:#605e5c}.box{rx:6;stroke-width:1.5}.blue{fill:#e8f1fb;stroke:#0078d4}.green{fill:#dff6dd;stroke:#107c10}.gold{fill:#fff4ce;stroke:#c19c00}.gray{fill:#f3f2f1;stroke:#8a8886}.line{fill:none;stroke:#605e5c;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#8a8886;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1120" height="400" fill="#fff"/>
  <text x="24" y="31" class="title">Observe every governed surface from one APIM diagnostic setting</text>
  <rect x="30" y="78" width="210" height="78" class="box blue"/>
  <text x="135" y="108" text-anchor="middle" class="label">Local MAF</text>
  <text x="135" y="133" text-anchor="middle" class="small">signed-in user or workload MI</text>
  <rect x="30" y="224" width="210" height="78" class="box blue"/>
  <text x="135" y="254" text-anchor="middle" class="label">Foundry app agent</text>
  <text x="135" y="279" text-anchor="middle" class="small">project managed identity</text>
  <rect x="330" y="58" width="300" height="278" class="box green"/>
  <text x="480" y="87" text-anchor="middle" class="label">Customer-owned APIM</text>
  <rect x="360" y="108" width="240" height="42" rx="4" fill="#fff" stroke="#107c10"/>
  <text x="480" y="134" text-anchor="middle" class="text">Model API</text>
  <rect x="360" y="162" width="240" height="42" rx="4" fill="#fff" stroke="#107c10"/>
  <text x="480" y="188" text-anchor="middle" class="text">Raw MCP API</text>
  <rect x="360" y="216" width="240" height="42" rx="4" fill="#fff" stroke="#107c10"/>
  <text x="480" y="242" text-anchor="middle" class="text">Toolbox API</text>
  <rect x="360" y="270" width="240" height="42" rx="4" fill="#fff" stroke="#107c10"/>
  <text x="480" y="296" text-anchor="middle" class="text">Enterprise A2A API</text>
  <rect x="720" y="58" width="370" height="108" class="box gold"/>
  <text x="905" y="86" text-anchor="middle" class="label">Service diagnostic setting</text>
  <text x="745" y="113" class="small">GatewayLogs + AllMetrics</text>
  <text x="745" y="134" class="small">resource-specific destination</text>
  <text x="745" y="153" class="small">content-bearing AI logs disabled</text>
  <rect x="720" y="202" width="370" height="134" class="box gray"/>
  <text x="905" y="230" text-anchor="middle" class="label">Log Analytics workspace</text>
  <text x="745" y="258" class="small">ApiManagementGatewayLogs</text>
  <text x="745" y="279" class="small">AzureMetrics</text>
  <text x="745" y="300" class="small">status + total/backend latency</text>
  <text x="745" y="321" class="small">API + operation + correlation ID</text>
  <path d="M240 117 C278 117 292 144 330 144" class="line"/>
  <path d="M240 263 C278 263 292 250 330 250" class="line"/>
  <path d="M630 122 H720" class="dash"/>
  <path d="M905 166 V202" class="line"/>
  <rect x="332" y="358" width="456" height="28" class="box gray"/>
  <text x="560" y="377" text-anchor="middle" class="small">Inspect in APIM Logs and Analytics, or run show-apim-observability.ps1</text>
</svg>