<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Scenario 1 model flow for two consumers</title><desc id="desc">A local MAF agent and a Foundry-hosted agent call the same APIM model API with Entra identities. APIM calls a two-region Foundry model pool with managed identity.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#605e5c"/></marker><style>.title{font:600 19px 'Segoe UI',sans-serif;fill:#201f1e}.label{font:600 14px 'Segoe UI',sans-serif;fill:#201f1e}.text{font:12px 'Segoe UI',sans-serif;fill:#323130}.small{font:11px 'Segoe UI',sans-serif;fill:#605e5c}.box{rx:6;stroke-width:1.5}.blue{fill:#e8f1fb;stroke:#0078d4}.green{fill:#dff6dd;stroke:#107c10}.gold{fill:#fff4ce;stroke:#c19c00}.line{fill:none;stroke:#605e5c;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
  <rect width="1120" height="360" fill="#fff"/><text x="24" y="31" class="title">Scenario 1: one OpenAI-compatible model contract, two identity-aware consumers</text>
  <rect x="38" y="78" width="235" height="82" class="box blue"/><text x="155" y="108" text-anchor="middle" class="label">1a. Local MAF agent</text><text x="155" y="132" text-anchor="middle" class="text">DefaultAzureCredential</text><text x="155" y="150" text-anchor="middle" class="small">OpenAIChatCompletionClient</text>
  <rect x="38" y="208" width="235" height="96" class="box blue"/><text x="155" y="238" text-anchor="middle" class="label">1b. Foundry app agent</text><text x="155" y="262" text-anchor="middle" class="text">ApiManagement connection</text><text x="155" y="281" text-anchor="middle" class="small">ProjectManagedIdentity</text><text x="155" y="297" text-anchor="middle" class="small">model: connection/model</text>
  <rect x="402" y="112" width="300" height="150" class="box green"/><text x="552" y="143" text-anchor="middle" class="label">APIM /inference-mi/openai</text><text x="552" y="169" text-anchor="middle" class="text">validate tenant + audience + oid</text><text x="552" y="191" text-anchor="middle" class="text">backend pool + circuit breaker</text><text x="552" y="213" text-anchor="middle" class="text">retry on 429 or 503</text><text x="552" y="238" text-anchor="middle" class="small">replace caller token with APIM MI token</text>
  <rect x="835" y="72" width="245" height="96" class="box gold"/><text x="957" y="104" text-anchor="middle" class="label">Foundry 1</text><text x="957" y="128" text-anchor="middle" class="text">East US 2, priority 1</text><text x="957" y="149" text-anchor="middle" class="small">gpt-4o-mini</text>
  <rect x="835" y="213" width="245" height="96" class="box gold"/><text x="957" y="245" text-anchor="middle" class="label">Foundry 2</text><text x="957" y="269" text-anchor="middle" class="text">Sweden Central, priority 2</text><text x="957" y="290" text-anchor="middle" class="small">gpt-4o-mini</text>
  <path d="M273 119 C330 119 345 163 402 163" class="line"/><text x="332" y="112" text-anchor="middle" class="small">user token</text>
  <path d="M273 256 C330 256 345 210 402 210" class="line"/><text x="333" y="269" text-anchor="middle" class="small">project MI token</text>
  <path d="M702 166 C770 166 775 120 835 120" class="line"/><path d="M702 211 C770 211 775 261 835 261" class="line"/><text x="770" y="153" text-anchor="middle" class="small">APIM MI</text>
  <text x="560" y="333" text-anchor="middle" class="small">Both clients use the same URL shape and receive the same APIM policy, routing, and telemetry.</text>
</svg>
