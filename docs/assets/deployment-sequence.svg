<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">Workshop deployment sequence</title>
  <desc id="desc">Four PowerShell deployments create the core gateway, consumer projects, APIM surfaces and connections, and the Foundry A2A publisher.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#605e5c"/></marker><style>.title{font:600 19px 'Segoe UI',sans-serif;fill:#201f1e}.step{font:600 14px 'Segoe UI',sans-serif;fill:#201f1e}.text{font:12px 'Segoe UI',sans-serif;fill:#323130}.small{font:11px 'Segoe UI',sans-serif;fill:#605e5c}.box{rx:6;stroke-width:1.5}.blue{fill:#e8f1fb;stroke:#0078d4}.green{fill:#dff6dd;stroke:#107c10}.gold{fill:#fff4ce;stroke:#c19c00}.gray{fill:#f3f2f1;stroke:#8a8886}.line{fill:none;stroke:#605e5c;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
  <rect width="1120" height="330" fill="#fff"/><text x="24" y="31" class="title">Deploy from left to right; each step adds one ownership boundary</text>
  <rect x="30" y="72" width="230" height="144" class="box green"/><text x="145" y="101" text-anchor="middle" class="step">1. Core gateway</text><text x="145" y="127" text-anchor="middle" class="text">deploy.ps1</text><text x="50" y="154" class="small">APIM Standard v2</text><text x="50" y="174" class="small">two enterprise Foundry regions</text><text x="50" y="194" class="small">model pool + raw MCP backend</text>
  <rect x="300" y="72" width="230" height="144" class="box blue"/><text x="415" y="101" text-anchor="middle" class="step">2. Consumers</text><text x="415" y="127" text-anchor="middle" class="text">deploy-foundry-consumers.ps1</text><text x="320" y="154" class="small">Toolbox publisher project</text><text x="320" y="174" class="small">Foundry app project</text><text x="320" y="194" class="small">ApiManagement model connection</text>
  <rect x="570" y="72" width="230" height="144" class="box green"/><text x="685" y="101" text-anchor="middle" class="step">3. Shared APIM surfaces</text><text x="685" y="127" text-anchor="middle" class="text">deploy-two-consumer-apim.ps1</text><text x="590" y="154" class="small">explicit caller oid allowlist</text><text x="590" y="174" class="small">raw MCP + Toolbox APIs</text><text x="590" y="194" class="small">project MI tool connections</text>
  <rect x="840" y="72" width="250" height="144" class="box gold"/><text x="965" y="101" text-anchor="middle" class="step">4. Enterprise A2A agent</text><text x="965" y="127" text-anchor="middle" class="text">deploy-enterprise-...</text><text x="860" y="154" class="small">publish prompt-agent version</text><text x="860" y="174" class="small">enable incoming A2A</text><text x="860" y="194" class="small">APIM facade + RemoteA2A connection</text>
  <path d="M260 144 H300" class="line"/><path d="M530 144 H570" class="line"/><path d="M800 144 H840" class="line"/>
  <rect x="168" y="250" width="784" height="54" class="box gray"/><text x="560" y="273" text-anchor="middle" class="step">Run the suite</text><text x="560" y="293" text-anchor="middle" class="text">run-two-consumer-scenarios.ps1 creates the Toolbox, runs both consumers, and checks eight denied requests</text>
  <path d="M965 216 C965 238 920 250 900 250" class="line"/>
</svg>
